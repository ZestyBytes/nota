<!doctype html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14160f" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>try{for(const k of Object.keys(localStorage))if(k.startsWith("nota-")){const n="noted-"+k.slice(5);if(localStorage.getItem(n)===null)localStorage.setItem(n,localStorage.getItem(k));localStorage.removeItem(k)}}catch(e){}
  try{const t=localStorage.getItem("noted-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="description" content="Noted, a record of days, thoughts, things learnt and things worth keeping.">
  <title>noted</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    THESIS: Noted is a private archive of specimens to browse, not a feed and
    not a form. Everything here is written in Obsidian; this app only reads
    and searches it, mobile-first.
    OWN-WORLD: sage-paper ground, graphite ink, saturated specimen-label inks
    per topic; Space Mono for labels, accession numbers and ink stamps,
    Spectral serif for prose; mounted corner-tape cards, pinned topic tags,
    rubber-stamp status marks, fading ink for older entries.
    STORY: Jamie reads each entry as a collected, catalogued specimen: status
    read from a stamp, topic from a pinned tag, recency from fading ink; no
    control anywhere creates, edits, or deletes a record.
    FIRST VIEWPORT: Today, phone width: a compact rail masthead, an oversized
    specimen-sheet "Today" title, a postmark-style date badge, specimen entry
    cards stacked full width, a field checklist and a pressed quote below.
    FORM: candidate 4 of the grounded list (Naturalist Field Notebook /
    Herbarium Archive), inherited from the desktop build and re-cut for a
    read/search-only mobile surface; seed key df5200b8.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
    the finish review, the verdict, DESIGN.md, and every shipping raster
    carrying its provenance.
  -->
  <header class="site-header">
    <button class="wordmark" type="button" data-theme-toggle aria-label="Use light theme" title="Change colour theme"><span class="wordmark-mark">noted<i>.</i></span><span class="wordmark-sub">field archive</span></button>
    <p class="header-date"><span class="hd-day"></span><b class="hd-date"></b></p>
    <nav class="main-nav" aria-label="Main navigation">

    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
