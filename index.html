<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef0e7">
  <meta name="description" content="Nota, a record of days, thoughts, things learnt and things worth keeping.">
  <title>nota</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!--
    THESIS: Nota is a private archive of specimens to browse, not a feed and
    not a form. Everything here is written in Obsidian; this app only reads
    and searches it, mobile-first.
    OWN-WORLD: sage-paper ground, graphite ink, saturated specimen-label inks
    per topic; Space Mono for labels, accession numbers and ink stamps,
    Spectral serif for prose; mounted corner-tape cards, pinned topic tags,
    rubber-stamp status marks, fading ink for older entries.
    STORY: Jamie reads each entry as a collected, catalogued specimen: status
    read from a stamp, topic from a pinned tag, recency from fading ink; no
    control anywhere creates, edits, or deletes a record.
    FIRST VIEWPORT: Today, phone width: a compact rail masthead, an oversized
    specimen-sheet "Today" title, a postmark-style date badge, specimen entry
    cards stacked full width, a field checklist and a pressed quote below.
    FORM: candidate 4 of the grounded list (Naturalist Field Notebook /
    Herbarium Archive), inherited from the desktop build and re-cut for a
    read/search-only mobile surface; seed key df5200b8.
    FINISH: unreviewed and undocumented is unfinished; this build ends with
    the finish review, the verdict, DESIGN.md, and every shipping raster
    carrying its provenance.
  -->
  <header class="site-header">
    <a class="wordmark" href="#today" aria-label="Nota home"><span class="wordmark-mark">nota<i>.</i></span><span class="wordmark-sub">field archive</span></a>
    <p class="header-date"><span class="hd-day"></span><b class="hd-date"></b></p>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#today"><i>01</i>Today</a><a href="#calendar"><i>02</i>Calendar</a><a href="#library"><i>03</i>Library</a><a href="#topics"><i>04</i>Topics</a><a href="#writing"><i>05</i>Writing</a><a href="#search"><i>06</i>Search</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <!--
    Nav icons are inline SVG, not an icon font or a CDN kit: they paint with
    the first frame, cost no request, work offline, and inherit the same
    1.6-weight pen line as the icons already drawn in app.js.
  -->
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="#today"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10.5 9-7.5 9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg><span>Today</span></a
    ><a href="#calendar"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3.5v4M16 3.5v4"/><path d="M7.5 13.5h2m3 0h2m3 0h.5m-11 4h2m3 0h2"/></svg><span>Calendar</span></a
    ><a href="#library"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v18H5.5A1.5 1.5 0 0 1 4 19.5Z"/><path d="M4 16.5h15"/><path d="M8.5 3v13.5"/></svg><span>Library</span></a
    ><a href="#topics"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2V4.5a1 1 0 0 1 1-1h6.7a1 1 0 0 1 .7.3l8.3 8.3a1 1 0 0 1 0 1.4l-6.7 6.7a1 1 0 0 1-1.4 0L3.8 11.9a1 1 0 0 1-.3-.7Z"/><circle cx="8" cy="8" r="1.4"/></svg><span>Topics</span></a
    ><a href="#search"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 4.6 4.6"/></svg><span>Search</span></a>
  </nav>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="backend.js"></script>
  <script src="app.js"></script>
</body>
</html>
