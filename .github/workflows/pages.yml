name: Deploy Nota to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Install data-build dependencies
        working-directory: quartz
        run: npm ci --ignore-scripts
      - name: Assemble the Nota app for deploy
        run: |
          mkdir -p dist
          cp index.html app.js styles.css config.js backend.js manifest.webmanifest icon.svg sw.js dist/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" dist/sw.js
      - name: Build data.js from Obsidian content
        run: node quartz/scripts/build-data.mjs --out dist/data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
